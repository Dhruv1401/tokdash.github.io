<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokdash — design 1 · atom</title>
<style>
  :root {
    --bg: #0a0f1e;
    --ink: #e8edf9;
    --muted: #8695b8;
    --line: rgba(154, 184, 240, 0.26);
    --axis: rgba(154, 184, 240, 0.10);
    --glow: rgba(104, 146, 255, 0.55);
    --mark: 26px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1150px 820px at 50% 44%, rgba(48, 78, 168, 0.30), transparent 68%),
      var(--bg);
    color: var(--ink);
    font: 400 16px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px; padding: 48px 24px;
    -webkit-font-smoothing: antialiased;
  }

  header { text-align: center; max-width: 620px; }
  h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600;
       letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  p { margin: 0; color: var(--muted); }
  p strong { color: var(--ink); font-weight: 600; }

  /* The stage supplies the vanishing point. Everything inside is transformed
     in 3D against it, so a mark on the back of a ring really is further away
     rather than merely drawn smaller. The perspective is long on purpose:
     strong enough for the near side of a ring to swell a little, weak enough
     that the geometry below still describes what lands on screen. */
  .stage { perspective: 3600px; perspective-origin: 50% 50%; }

  .atom {
    position: relative;
    width: 700px; height: 700px;
    transform-style: preserve-3d;
  }

  /* ---- The axes ----
     The x and y lines through the nucleus. They turn three rings into a set
     of axes rather than three decorative hoops, and stay faint enough never
     to compete with the marks riding them. */
  .axis {
    position: absolute; left: 50%; top: 0;
    width: 1px; height: 100%; margin-left: -0.5px;
    background: linear-gradient(180deg, transparent, var(--axis) 24%, var(--axis) 76%, transparent);
  }
  .axis-x {
    left: 0; top: 50%;
    width: 100%; height: 1px; margin: -0.5px 0 0 0;
    background: linear-gradient(90deg, transparent, var(--axis) 24%, var(--axis) 76%, transparent);
  }

  /* ---- One orbit ----
     A plain circle outline tipped about x, so it foreshortens into an
     ellipse on screen. It never moves: only the marks on it do. */
  .orbit { position: absolute; inset: 0; transform-style: preserve-3d; }
  .ring {
    position: absolute; left: 50%; top: 50%;
    width: calc(var(--r) * 2px); height: calc(var(--r) * 2px);
    margin: calc(var(--r) * -1px) 0 0 calc(var(--r) * -1px);
    border: 1px solid rgba(154, 184, 240, 0.17);
    border-radius: 50%;
    transition: border-color 220ms ease, box-shadow 220ms ease;
  }
  /* Pointing at a mark lights the shell it rides, so it is obvious which
     ring a tool is on rather than which of three circles it happens to be
     nearest. */
  .orbit.is-lit .ring {
    border-color: rgba(186, 210, 255, 0.7);
    box-shadow: 0 0 20px rgba(104, 146, 255, 0.38);
  }

  /* The spin layer carries the marks and turns about z. The marks sit at even
     angles on a fixed radius, so every one moves the same amount and the
     spacing between them never changes. */
  .spin {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    animation: spin var(--period) linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .slot {
    position: absolute; left: 50%; top: 50%;
    width: 0; height: 0;
    transform: rotate(var(--a)) translateX(calc(var(--r) * 1px));
  }

  /* A mark is white-backed so every logo stays readable, dark monochrome
     glyphs included. The light behind it is what sells the depth: brightest
     and largest at the near side of the ring, smallest and faintest round
     the back. Both the box and its glow share one delay so they rise and
     fade together with the mark's own position. */
  .mark {
    position: absolute; left: 0; top: 0;
    width: var(--mark); height: var(--mark);
    margin: calc(var(--mark) / -2) 0 0 calc(var(--mark) / -2);
    border-radius: 9px; background: #fff; padding: 3px;
    display: block; text-decoration: none;
    box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
    animation: depth var(--period) linear infinite;
    animation-delay: var(--delay);
  }
  .mark img { width: 100%; height: 100%; object-fit: contain; display: block; position: relative; }
  .mark::before {
    content: ''; position: absolute;
    left: 50%; top: 50%; width: 172%; height: 172%;
    margin: -86% 0 0 -86%;
    border-radius: 50%;
    background: radial-gradient(closest-side,
      rgba(122, 164, 255, 0.5), rgba(104, 146, 255, 0.16) 52%, transparent 76%);
    z-index: -1;
    animation: depth-glow var(--period) linear infinite;
    animation-delay: var(--delay);
  }
  @keyframes depth {
    0%, 100% { opacity: 0.22; transform: scale(0.6); }
    50%      { opacity: 1;    transform: scale(1.16); }
  }
  @keyframes depth-glow {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50%      { opacity: 1; transform: scale(1.16); }
  }

  /* The name appears only for the mark under the pointer, so the field stays
     a field. It rides below the mark and points back at it. */
  .mark .tag {
    position: absolute; left: 50%; top: calc(100% + 9px);
    transform: translateX(-50%);
    white-space: nowrap; font-size: 12px; font-weight: 600;
    color: var(--ink); background: rgba(10, 15, 30, 0.94);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; opacity: 0; transition: opacity 140ms ease;
    pointer-events: none;
  }
  .mark:hover .tag, .mark:focus-visible .tag { opacity: 1; }
  .mark:hover, .mark:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--glow); }

  /* ---- The nucleus ----
     A small bright core with the Tokdash mark in it, wrapped in two soft
     haloes: a tight one for the core's own light and a wide one that bleeds
     into the space around it. The wide one is allowed to reach under the
     innermost ring -- light under a mark reads as light, not as a
     collision, and the ring passing through the glow is most of the effect. */
  .nucleus {
    position: absolute; left: 50%; top: 50%;
    width: 76px; height: 76px; margin: -38px 0 0 -38px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 44%,
      #dce9ff, #8fb4ff 42%, rgba(48, 82, 168, 0.85) 78%, rgba(20, 34, 74, 0) 100%);
    box-shadow: 0 0 44px rgba(126, 166, 255, 0.55);
    animation: breathe 7s ease-in-out infinite;
  }
  .nucleus img { width: 34px; height: 34px; object-fit: contain; position: relative; z-index: 2; }
  .nucleus::before, .nucleus::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    border-radius: 50%; z-index: -1;
  }
  .nucleus::before {
    width: 116px; height: 116px; margin: -58px 0 0 -58px;
    background: radial-gradient(closest-side,
      rgba(104, 146, 255, 0.34), rgba(104, 146, 255, 0.1) 58%, transparent 78%);
  }
  .nucleus::after {
    width: 224px; height: 224px; margin: -112px 0 0 -112px;
    background: radial-gradient(closest-side,
      rgba(88, 126, 240, 0.2), rgba(88, 126, 240, 0.06) 52%, transparent 76%);
    animation: swell 11s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  @keyframes swell {
    0%, 100% { transform: scale(0.9); opacity: 0.6; }
    50%      { transform: scale(1.08); opacity: 1; }
  }

  figcaption { max-width: 680px; text-align: center; font-size: 13.5px; }
  figcaption b { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .spin, .mark, .mark::before, .nucleus, .nucleus::after { animation: none; }
    /* Standing still, every mark sits at full size and full strength and its
       glow is on: the atom reads as a diagram of where the marks live rather
       than as a thing that has stopped. */
    .mark { opacity: 1; transform: scale(1); }
    .mark::before { opacity: 0.85; transform: scale(1); }
  }
</style>
</head>
<body>

<header>
  <h1>Design 1 · atom</h1>
  <p>Twenty-four tools as electrons on three orbital shells around one
     nucleus — the way a Bohr diagram draws an atom.</p>
</header>

<figure style="margin:0">
  <div class="stage">
    <div class="atom" id="atom">
      <div class="axis"></div>
      <div class="axis-x"></div>
      <div class="nucleus"><img src="../static/icons/logo.png" alt=""></div>
    </div>
  </div>
  <figcaption>
    The three rings project to ellipses that are <b>strictly nested</b> — each
    one wholly inside the next — so no two marks can ever land on the same
    spot, at any phase or at any relative speed. The shells are set by
    measurement, not by eye: the closest two marks ever come on screen is
    <b>80px</b>, and the widest a mark ever draws is <b>38px</b>. Point at a
    mark and its shell lights up.
  </figcaption>
</figure>

<script>
(function () {
  // The tools, in the order the landing page lists them. Twenty-four, which
  // is what the page claims in every language.
  var TOOLS = [
    ['Codex', 'codex.png'],
    ['Claude Code', 'claude.svg'],
    ['OpenCode', 'opencode.png'],
    ['Gemini CLI', 'gemini.svg'],
    ['Antigravity', 'antigravity.png'],
    ['OpenClaw', 'openclaw.png'],
    ['Kimi CLI', 'kimi.png'],
    ['MiMo Code', 'mimo.svg'],
    ['Grok Build', 'grok.png'],
    ['Pi', 'pi.png'],
    ['Copilot CLI', 'copilot.svg'],
    ['Hermes', 'hermes.png'],
    ['DeepSeek Harness', 'dsh.svg'],
    ['Reasonix', 'reasonix.svg'],
    ['ZCode', 'zcode.png'],
    ['WorkBuddy', 'workbuddy.png'],
    ['Qoder', 'qoder.png'],
    ['omp', 'omp.png'],
    ['Kilo Code', 'kilocode.png'],
    ['Cline', 'cline.png'],
    ['Zed', 'zed.svg'],
    ['Qwen Code', 'qwen_code.svg'],
    ['Crush', 'crush.png'],
    ['Muse Code', 'muse.svg']
  ];

  // Radius, how far the shell's plane is tipped about x, seconds per
  // revolution, and how many marks ride it.
  //
  // Why the rings nest rather than cross, which is worth writing down
  // because the obvious arrangement genuinely does not work.
  //
  // A shell tipped by t projects to an ellipse of half-width r and
  // half-height r*cos(t). Three shells that grow in radius while staying
  // fairly flat -- the textbook 0/60/120 at 120/195/270 -- project to
  // ellipses that CROSS. Crossing ellipses put marks on top of each other
  // eventually, whatever the phases and speeds are chosen to be: at those
  // settings two marks overlapped by about half their width within seconds.
  //
  // It is not enough for the rings not to touch in three dimensions, which
  // at different radii they never do. The projection is what anyone sees, so
  // the projection has to be clean.
  //
  //   * Crossing cannot be rescued by tuning, either. Two shells on crossing
  //     paths have marks sweeping through the same crossing points on their
  //     own cycles; with independent speeds those passes come arbitrarily
  //     close sooner or later, and with 26px marks the pass windows are tens
  //     of degrees wide. So the shells are chosen to nest instead:
  //
  //   inner  130 at 124deg -> half-height  73
  //   middle 250 at  54deg -> half-height 147
  //   outer  330 at   0deg -> half-height 330
  //
  // measured, the gaps between neighbouring shells in the plane are 74px and
  // 80px against a mark that never draws wider than 38px on screen, and the
  // closest any two marks ever come, counted on screen, is 80px. Nothing here
  // can overlap anything else.
  //
  // The counts follow the circumference so the spacing on a shell comes out
  // even, and the periods shorten toward the middle the way shells do.
  var ORBITS = [
    { r: 130, tilt: 124, period: 15, count: 6  },
    { r: 250, tilt: 54,  period: 23, count: 8  },
    { r: 330, tilt: 0,   period: 33, count: 10 }
  ];

  var LOGOS = '../static/icons/agents/';
  var atom = document.getElementById('atom');
  var n = 0;

  ORBITS.forEach(function (o) {
    var orbit = document.createElement('div');
    orbit.className = 'orbit';
    orbit.style.setProperty('--r', o.r);
    orbit.style.setProperty('--tilt', o.tilt + 'deg');

    var ring = document.createElement('div');
    ring.className = 'ring';
    orbit.appendChild(ring);

    var spin = document.createElement('div');
    spin.className = 'spin';
    spin.style.setProperty('--period', o.period + 's');

    for (var k = 0; k < o.count; k++) {
      var angle = (360 / o.count) * k;
      var tool = TOOLS[n];
      n++;

      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.setProperty('--a', angle + 'deg');

      var a = document.createElement('a');
      a.className = 'mark';
      a.href = '#';
      a.dataset.name = tool[0];
      // Brightest when this mark is at the near side of its shell. That is a
      // quarter of the way round, and the depth keyframe peaks half a cycle
      // in, so the delay shifts back by half the period.
      var peak = ((90 - angle) / 360) * o.period;
      a.style.setProperty('--delay', (peak - o.period / 2) + 's');

      var img = document.createElement('img');
      img.src = LOGOS + tool[1];
      img.alt = '';
      img.loading = 'lazy';
      img.onerror = function () { this.style.display = 'none'; };
      a.appendChild(img);

      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = tool[0];
      a.appendChild(tag);

      function light(on) { orbit.classList[on ? 'add' : 'remove']('is-lit'); }
      a.addEventListener('pointerenter', function () { light(true); });
      a.addEventListener('pointerleave', function () { light(false); });
      a.addEventListener('focus', function () { light(true); });
      a.addEventListener('blur', function () { light(false); });

      slot.appendChild(a);
      spin.appendChild(slot);
    }

    orbit.appendChild(spin);
    atom.appendChild(orbit);
  });

  if (n !== 24) console.warn('expected 24 marks, placed ' + n);
})();
</script>
</body>
</html>
