name: Demo checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  mock-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-mock-api.mjs

  landing-ticker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.61.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_ticker.py
      - run: python verify_landing.py
