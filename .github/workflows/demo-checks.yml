name: Demo checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  mock-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-mock-api.mjs
